apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  selector:
    {{- include "platform.selector" (dict "root" . "name" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "platform.selector" (dict "root" . "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "platform.podSecurity" . | nindent 8 }}
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          securityContext:
            {{- include "platform.containerSecurity" . | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - { name: POSTGRES_DB, value: gateway }
            - { name: POSTGRES_USER, value: gateway }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: postgres-password } }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "gateway", "-d", "gateway"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "gateway", "-d", "gateway"] }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}
