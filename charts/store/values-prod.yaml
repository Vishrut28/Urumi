# Production-like VPS (k3s). Only these values differ from local.
# Replace 203-0-113-10 with your VPS IP (sslip.io needs no DNS setup), or use your own domain.
store:
  host: shop.203-0-113-10.sslip.io
  scheme: https
  title: "Demo Store"
ingress:
  className: traefik
  tls:
    enabled: true
    secretName: storefront-tls
    clusterIssuer: letsencrypt-prod
images:
  wooMcp:
    repository: ghcr.io/vishrut28/woo-mcp
    tag: "1.0.0"
    pullPolicy: IfNotPresent
persistence:
  storageClass: local-path    # k3s default; swap for longhorn or a cloud class
  wordpressSize: 10Gi
  databaseSize: 10Gi
resources:
  wordpress:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { cpu: "2", memory: 1Gi }
  mariadb:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 1Gi }
networkPolicy:
  gatewayNamespace: platform
