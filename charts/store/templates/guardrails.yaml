{{- if .Values.guardrails.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: store-quota
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  hard:
    {{- toYaml .Values.guardrails.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: store-limits
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        {{- toYaml .Values.guardrails.defaultLimits | nindent 8 }}
      defaultRequest:
        {{- toYaml .Values.guardrails.defaultRequests | nindent 8 }}
{{- end }}
