# k3d cluster for local development: one k3s server, Traefik ingress on host :80/:443.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: woo
servers: 1
agents: 0
ports:
  - port: 80:80
    nodeFilters: [loadbalancer]
  - port: 443:443
    nodeFilters: [loadbalancer]
options:
  k3s:
    extraArgs: []
