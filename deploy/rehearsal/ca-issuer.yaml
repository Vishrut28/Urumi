# A private CA for the production rehearsal: same cert-manager flow as Let's Encrypt
# (Ingress annotation -> Certificate -> TLS Secret), but issuable without public DNS.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rehearsal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: woo-mcp-gateway rehearsal CA
  secretName: rehearsal-ca
  duration: 2160h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: rehearsal-ca
spec:
  ca:
    secretName: rehearsal-ca
